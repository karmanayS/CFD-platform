services:
  redis:
    image: redis
    ports: 
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s    

  poller:
    build:
      context: ./poller
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy  
    env_file:
      - ./poller/.env

  ws:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    ports: 
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy  
    env_file: 
      - ./ws-server/.env

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy  
    env_file: 
      - ./engine/.env

  api:
    build:
      context: ./http-server
      dockerfile: Dockerfile
    ports: 
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy  
    env_file: 
      - ./http-server/.env    
