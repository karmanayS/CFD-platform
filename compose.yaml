services:
  redis:
    image: redis
    ports: 
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s  

  poller:
    build:
      context: ./poller
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy  
    
  ws:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    ports: 
      - "8080:8080"
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile

  api:
    build:
      context: ./http-server
      dockerfile: Dockerfile
    ports: 
      - "3000:3000"
    environment: 
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - API_BASE_URL=${API_BASE_URL}  
    
